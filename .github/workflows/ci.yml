name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check tello_bridge tests main.py

      - name: Tests
        run: pytest -q --cov=tello_bridge --cov-report=term-missing

  docs:
    name: Docs & package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install PyYAML
      - name: Check required docs
        run: |
          test -f README.md
          test -f docs/MANUAL.md
          test -f homeassistant/tello_package.yaml
          test -f .env.example
          python -c "import yaml; yaml.safe_load(open('homeassistant/tello_package.yaml', encoding='utf-8'))"
          python -c "import yaml; yaml.safe_load(open('config.yaml', encoding='utf-8'))"
